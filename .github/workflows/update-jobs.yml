name: Refresh job listings

on:
  schedule:
    # Once daily at 6am UTC (~270 JSearch requests/month, inside the free tier)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggregate jobs
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/aggregate.py

      - name: Commit updated listings
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "chore: refresh job listings [skip ci]"
          git push
